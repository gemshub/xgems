name: xgems

channels:
  - https://gemshub.github.io/xgems/prerelease   # gems3k (master) with Optima (gemshub optima_develop) built in
  - conda-forge

dependencies:
  - gxx_linux-64 # [linux]
  - cmake>=3.16
  - ninja
  - git
  - ccache  # [unix]
  - python>=3.10
  - pip
  - setuptools
  - wheel
  - pytest
  - pybind11
  - nlohmann_json
  - numpy
  - eigen>=3.4.0
  - autodiff>=1.1.1
  - gems3k >=5.2 optima*   # prerelease build with the Optima solver
  - thermofun >=0.7.1,<1
  - chemicalfun
  - spdlog
 
