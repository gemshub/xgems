name: xgems

channels:
  - conda-forge

dependencies:
  - gxx_linux-64 # [linux]
  - cmake>=3.16
  - ninja
  - git
  - ccache  # [unix]
  - python>=3.10
  - pip
  - setuptools
  - wheel
  - pytest
  - pybind11
  - nlohmann_json
