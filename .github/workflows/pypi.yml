# Build xgems wheels + sdist and upload them to PyPI.
#
#  - Every push/PR to main/master: builds and tests the wheels (no upload).
#  - Publishing a GitHub release (tag vX.Y.Z): uploads to PyPI.
#  - Manual run (Actions > pypi > Run workflow): choose testpypi or pypi.
#
# Authentication (see the PR description for step-by-step setup):
#  - Recommended: PyPI "trusted publishing" (no secret needed). On pypi.org / test.pypi.org
#    add a publisher: owner gemshub, repo xgems, workflow pypi.yml, environment pypi / testpypi.
#  - Alternative: API tokens stored as secrets PYPI_API_TOKEN / TEST_PYPI_API_TOKEN.
#    If a secret is set it is used; if it is empty, trusted publishing is used.
# Create the environments "pypi" and "testpypi" in repo Settings > Environments.
name: pypi

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to upload
        type: choice
        options: [none, testpypi, pypi]
        default: testpypi

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Wheels ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64,  os: ubuntu-latest}
          - {name: linux-aarch64, os: ubuntu-24.04-arm}
          - {name: macos-arm64,   os: macos-latest}
          - {name: macos-x86_64,  os: macos-15-intel}
          - {name: windows-amd64, os: windows-latest}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # macOS / Windows: build the static C++ deps on the host once (Linux does
      # this inside the manylinux container via before-all in pyproject.toml).
      - name: Build C++ dependencies (macOS / Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            root="$(cygpath -m "$RUNNER_TEMP")"; here="$(cygpath -m "$PWD")"
          else
            root="$RUNNER_TEMP"; here="$PWD"
          fi
          echo "XGEMS_DEPS_PREFIX=$root/xgems-deps" >> "$GITHUB_ENV"
          echo "XGEMS_DEPS_PRELOAD=$here/.github/workflows/preload-deps.cmake" >> "$GITHUB_ENV"
          XGEMS_DEPS_PREFIX="$root/xgems-deps" XGEMS_DEPS_WORK="$root/xgems-deps-src" JOBS=4 \
            bash .github/workflows/build-deps.sh

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.3.5

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build sdist
        run: pipx run build --sdist
      - name: Check metadata
        run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload:
    name: Upload
    needs: [build_wheels, build_sdist]
    if: >-
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch' && inputs.target != 'none')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
      url: ${{ (github.event_name == 'release' || inputs.target == 'pypi') && 'https://pypi.org/p/xgems' || 'https://test.pypi.org/p/xgems' }}
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          sdist=$(ls dist/xgems-*.tar.gz); ver="${sdist#dist/xgems-}"; ver="${ver%.tar.gz}"
          echo "tag=$tag package=$ver"
          if [[ "$tag" != "$ver" ]]; then
            echo "::error::Release tag v$tag does not match project(xGEMS VERSION $ver) in CMakeLists.txt"
            exit 1
          fi

      - run: ls -l dist

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

      - name: Publish to PyPI
        if: github.event_name == 'release' || inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
