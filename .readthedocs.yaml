# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
#
# This branch (develop_optima) builds the docs with Sphinx on Read the Docs, from a conda
# environment that installs the prerelease xgems package (the compiled module is needed to read
# the Python docstrings). Nothing generated is committed. Published at /en/develop_optima/.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "miniforge3-latest"

conda:
  environment: docs/rtd-environment.yml

sphinx:
  configuration: docs/sphinx/source/conf.py
