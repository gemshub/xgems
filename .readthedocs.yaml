# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
#
# Read the Docs builds the docs with Sphinx, from a conda environment that installs the xgems
# package of the same version from the prerelease channel (the compiled module is needed to read
# the Python docstrings). Each branch and tag is published under its own name, for example /en/latest/.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "miniforge3-latest"
  jobs:
    pre_create_environment:
      - sh docs/set-xgems-version.sh

conda:
  environment: docs/rtd-environment.yml

sphinx:
  configuration: docs/sphinx/source/conf.py
